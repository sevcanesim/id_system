name: Authenticated Surfaces

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/authenticated-surfaces.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Compact migrated corporate CSS once
        if: github.actor != 'github-actions[bot]'
        run: |
          if [ -f scripts/compact-corporate-css.mjs ]; then
            node scripts/compact-corporate-css.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/styles/canonical-corporate.css scripts/compact-corporate-css.mjs
            git commit -m "refactor(css): compact migrated corporate styles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated architecture
        run: node scripts/verify-authenticated-surfaces.mjs
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Verify CSS architecture
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:css-architecture
      - name: Build
        run: npm run build
