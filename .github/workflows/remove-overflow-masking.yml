name: Remove Overflow Masking

on:
  push:
    branches:
      - refactor/master-responsive-zero-regression
    paths:
      - ".github/workflows/remove-overflow-masking.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/master-responsive-zero-regression
          fetch-depth: 0
      - name: Remove top-level overflow masking only
        run: |
          python - <<'PY'
          from pathlib import Path

          production = Path('app/styles/canonical-responsive-production.css')
          source = production.read_text()
          replacements = {
            '  min-height: 100svh;\n  overflow-x: clip;\n': '  min-height: 100svh;\n',
            '  padding-inline: clamp(var(--space-5), 2.25vw, var(--space-10));\n  overflow-x: clip;\n': '  padding-inline: clamp(var(--space-5), 2.25vw, var(--space-10));\n',
          }
          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f'Expected production mask pattern missing: {old!r}')
            source = source.replace(old, new, 1)
          production.write_text(source)

          final = Path('app/styles/canonical-responsive-final.css')
          final_source = final.read_text()
          candidates = [
            '.public-site main{overflow-x:clip;}',
            '.public-site main {overflow-x:clip;}',
            '.public-site main { overflow-x:clip;}',
            '.public-site main { overflow-x: clip; }',
          ]
          matched = next((candidate for candidate in candidates if candidate in final_source), None)
          if not matched:
            raise SystemExit('Expected .public-site main overflow-x clip rule missing')
          final_source = final_source.replace(matched, '', 1)
          final.write_text(final_source)
          PY
      - name: Commit root-cause visibility cleanup and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-overflow-masking.yml
          git add app/styles/canonical-responsive-production.css app/styles/canonical-responsive-final.css
          git commit -m "fix(responsive): expose document overflow at its source"
          git push origin HEAD:refactor/master-responsive-zero-regression
