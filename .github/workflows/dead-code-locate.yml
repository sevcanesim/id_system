name: Locate Cleanup Blocker

on:
  push:
    branches:
      - refactor/master-responsive-zero-regression
    paths:
      - .github/workflows/dead-code-locate.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate stale symbol and sidebar type imports
        run: |
          echo '--- setCardStatus ---'
          git grep -n -w setCardStatus -- app lib types || true
          echo '--- sidebar.types imports ---'
          git grep -n 'sidebar.types' -- app lib types || true
