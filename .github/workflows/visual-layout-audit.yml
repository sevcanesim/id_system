name: Visual Layout Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-layout-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product engineering contract
        run: npm run verify:product-engineering
      - name: CSS architecture
        run: npm run verify:css-architecture
      - name: UI system
        run: npm run verify:ui-system
      - name: Typography system
        run: npm run verify:typography
      - name: Typecheck
        run: npm run typecheck
      - name: Public and commerce visual/layout matrix
        run: npx playwright test tests/e2e/visual-layout-audit.spec.ts --project=chromium-desktop
