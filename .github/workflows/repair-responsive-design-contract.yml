name: Repair Responsive Design Contract

on:
  push:
    branches:
      - refactor/master-responsive-zero-regression
    paths:
      - ".github/workflows/repair-responsive-design-contract.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/master-responsive-zero-regression
          fetch-depth: 0
      - name: Restore baseline responsive source and canonical typography
        run: |
          git fetch origin main
          git show origin/main:app/styles/canonical-responsive-final.css > app/styles/canonical-responsive-final.css
          python - <<'PY'
          from pathlib import Path

          tokens = Path('app/design-tokens.css')
          source = tokens.read_text()
          replacements = {
            '  /* Compact application typography. Product/public display surfaces can opt\n   * into larger route-specific display type, but application chrome and\n   * panels never exceed this scale. */': '  /* Canonical accessible typography scale shared by public, commerce and application surfaces. */',
            '  --type-xs: 10px;': '  --type-xs: 11px;',
            '  --type-sm: 11px;': '  --type-sm: 12px;',
            '  --type-body-sm: 12px;': '  --type-body-sm: 14px;',
            '  --type-body: 13px;': '  --type-body: 16px;',
            '  --type-body-lg: 14px;': '  --type-body-lg: 18px;',
            '  --type-h4: 15px;': '  --type-h4: 20px;',
            '  --type-h3: 17px;': '  --type-h3: 24px;',
            '  --type-h2: 20px;': '  --type-h2: clamp(28px, 3vw, 40px);',
            '  --type-h1: 24px;': '  --type-h1: clamp(40px, 4.8vw, 64px);',
            '  --type-display: 28px;': '  --type-display: clamp(48px, 6vw, 76px);',
            '  --type-metric: 18px;': '  --type-metric: 24px;',
          }
          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f'Expected token pattern missing: {old!r}')
            source = source.replace(old, new, 1)
          tokens.write_text(source)

          verifier = Path('scripts/verify-typography-system.mjs')
          source = verifier.read_text()
          start = source.index('// Application typography was intentionally capped')
          end = source.index('\n\nconst checks = [', start)
          canonical = '''const semanticScale = [
  ["--type-xs: 11px", "caption type token is 11px"],
  ["--type-sm: 12px", "label type token is 12px"],
  ["--type-body-sm: 14px", "small body type token is 14px"],
  ["--type-body: 16px", "body type token is 16px"],
  ["--type-body-lg: 18px", "large body type token is 18px"],
  ["--type-h4: 20px", "h4 token is 20px"],
  ["--type-h3: 24px", "h3 token is 24px"],
  ["--type-h2: clamp(28px, 3vw, 40px)", "h2 token is canonical"],
  ["--type-h1: clamp(40px, 4.8vw, 64px)", "h1 token is canonical"],
  ["--type-display: clamp(48px, 6vw, 76px)", "display token is canonical"],
  ["--type-metric: 24px", "metric token is 24px"],
];'''
          source = source[:start] + canonical + source[end:]
          verifier.write_text(source)
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-responsive-design-contract.yml
          git add app/design-tokens.css app/styles/canonical-responsive-final.css scripts/verify-typography-system.mjs
          git commit -m "fix(design-system): restore canonical responsive and type contracts"
          git push origin HEAD:refactor/master-responsive-zero-regression
