name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce Design System Standard
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-design-system-standard.mjs

      - name: Enforce CSS architecture budget
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-css-budget.mjs

      - name: Audit cascade-safe canonical tail
        run: node scripts/split-canonical-css.mjs --domain=auto

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify UI system contract
        run: npm run verify:ui-system

      - name: Verify P0 static release gates
        run: npm run verify:p0:static

      - name: Verify dead-code and orphan cleanup
        run: npm run verify:faz7:cleanup

      - name: Verify source and build
        run: npm run verify:release

      - name: Verify release packaging
        run: npm run release:package

      - name: Enforce release artifact budget and hygiene
        run: npm run verify:release-artifact

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: source-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/yenomi-next.log 2>&1 &

      - name: Wait for application
        run: npx --yes wait-on http://127.0.0.1:3000

      - name: Run desktop public and security regression
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/public-nav.spec.ts e2e/homepage-funnel-density.spec.ts e2e/security-headers.spec.ts --project=chromium

      - name: Run mobile public regression
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/public-nav.spec.ts e2e/homepage-funnel-density.spec.ts --project=mobile-chromium

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/yenomi-next.log
