name: Apply Corporate Lazy Refactor

on:
  push:
    branches:
      - refactor/authenticated-surfaces-optimization
    paths:
      - scripts/apply-corporate-lazy-refactor.mjs
      - .github/workflows/apply-corporate-lazy-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/authenticated-surfaces-optimization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/apply-corporate-lazy-refactor.mjs
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/kurumsal/panel/CorporatePanelClient.tsx scripts/apply-corporate-lazy-refactor.mjs .github/workflows/apply-corporate-lazy-refactor.yml
          git commit -m "refactor(corporate): lazy load panel data by tab"
          git push origin HEAD:refactor/authenticated-surfaces-optimization
