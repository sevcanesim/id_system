name: Protected Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yenomi-production-deploy
  cancel-in-progress: false

jobs:
  staging-gate:
    uses: ./.github/workflows/staging-integration.yml
    secrets: inherit

  deploy:
    needs: staging-gate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      PAYTR_MERCHANT_ID: ${{ secrets.PRODUCTION_PAYTR_MERCHANT_ID }}
      PAYTR_MERCHANT_KEY: ${{ secrets.PRODUCTION_PAYTR_MERCHANT_KEY }}
      PAYTR_MERCHANT_SALT: ${{ secrets.PRODUCTION_PAYTR_MERCHANT_SALT }}
      PAYTR_PRESENTATION_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_PAYTR_PRESENTATION_ENCRYPTION_KEY }}
      PAYTR_TEST_MODE: "false"

      UPSTASH_REDIS_REST_URL: ${{ secrets.PRODUCTION_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.PRODUCTION_UPSTASH_REDIS_REST_TOKEN }}

      LEGAL_TRADE_NAME: "Sevcan Eşim Karadeniz"
      LEGAL_ENTITY_TYPE: "Şahıs işletmesi"
      LEGAL_TAX_NUMBER: ${{ secrets.LEGAL_TAX_NUMBER }}
      LEGAL_TAX_OFFICE: ${{ secrets.LEGAL_TAX_OFFICE }}
      LEGAL_MERSIS_NUMBER: ${{ secrets.LEGAL_MERSIS_NUMBER }}
      LEGAL_REGISTERED_ADDRESS: ${{ secrets.LEGAL_REGISTERED_ADDRESS }}
      LEGAL_AUTHORIZED_PERSON: ${{ secrets.LEGAL_AUTHORIZED_PERSON }}
      LEGAL_PHONE: ${{ secrets.LEGAL_PHONE }}
      LEGAL_WEBSITE: ${{ secrets.LEGAL_WEBSITE }}
      LEGAL_CONTACT_EMAIL: ${{ secrets.LEGAL_CONTACT_EMAIL }}
      LEGAL_SALES_EMAIL: ${{ secrets.LEGAL_SALES_EMAIL }}
      LEGAL_KVKK_EMAIL: ${{ secrets.LEGAL_KVKK_EMAIL }}
      LEGAL_PAYMENT_PROVIDER: "PayTR"
      LEGAL_INVOICE_PROVIDER: "Mysoft"
      LEGAL_EFFECTIVE_DATE: ${{ secrets.LEGAL_EFFECTIVE_DATE }}
      LEGAL_CONTENT_APPROVED: ${{ secrets.LEGAL_CONTENT_APPROVED }}
      LEGAL_CONTENT_APPROVED_AT: ${{ secrets.LEGAL_CONTENT_APPROVED_AT }}

      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production promotion contract
        run: npm run verify:phase20:production

      - name: Pull Vercel production configuration
        run: npx --yes vercel@58.9.1 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifact
        run: npx --yes vercel@58.9.1 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy verified artifact
        run: npx --yes vercel@58.9.1 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify production smoke surface
        run: npm run verify:faz10:smoke
