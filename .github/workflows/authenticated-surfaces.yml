name: Authenticated Surfaces

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - ".github/workflows/authenticated-surfaces.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply one-shot corporate CSS consolidation
        if: github.actor != 'github-actions[bot]'
        run: |
          if [ -f scripts/apply-corporate-css-consolidation.mjs ]; then
            node scripts/apply-corporate-css-consolidation.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/styles/canonical-corporate.css app/layout.tsx app/kurumsal/layout.tsx app/kurumsal/panel/layout.tsx app/kurumsal/panel scripts/apply-corporate-css-consolidation.mjs
            git commit -m "refactor(corporate): consolidate panel CSS ownership"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: npm ci
      - name: Verify authenticated architecture
        run: node scripts/verify-authenticated-surfaces.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Verify CSS architecture budget
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-css-budget.mjs
      - name: Build
        run: npm run build
