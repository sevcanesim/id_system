name: Commerce Resilience

on:
  pull_request:
    paths:
      - "app/api/commerce/**"
      - "app/api/admin/commerce/**"
      - "app/api/organizations/members/bulk-invite/**"
      - "app/c/**"
      - "app/checkout/**"
      - "app/hesabim/**"
      - "lib/auth/**"
      - "lib/commerce/**"
      - "lib/security/**"
      - "supabase/migrations/**"
      - "scripts/verify-commerce-resilience.mjs"
      - ".github/workflows/commerce-resilience.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify resilience contracts
        run: node scripts/verify-commerce-resilience.mjs
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Verify CSS architecture
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:css-architecture
      - name: Build
        run: npm run build
