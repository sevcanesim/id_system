name: Canonical Split Audit

on:
  push:
    branches:
      - refactor/canonical-modularization-phase2

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Detect cascade-safe canonical tail
        run: node scripts/split-canonical-css.mjs --domain=auto
